{% load static %}

<section id="top" class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden bg-[#0a0a0f] pt-24 pb-8">
    
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff10_1px,transparent_1px),linear-gradient(to_bottom,#ffffff10_1px,transparent_1px)] bg-size-[5rem_5rem] animate-grid-move mask-[radial-gradient(ellipse_70%_60%_at_50%_50%,#000_80%,transparent_100%)]"></div>
        <div class="absolute top-1/3 left-1/4 -z-10 h-125 w-125 rounded-full bg-primary/10 blur-[140px]"></div>
        <canvas id="bg-canvas" class="absolute inset-0 h-full w-full opacity-80"></canvas>
    </div>

    <div class="absolute top-0 right-0 h-full w-full lg:w-3/5 pointer-events-none z-0 flex items-center justify-end overflow-hidden">
        <div class="relative h-full w-full">
            <img src="{% static 'images/hero-img.png' %}" alt="Yaroslav Zaitsev" class="h-full w-full z-0 object-cover object-center filter grayscale brightness-90">

            <div class="absolute bottom-0 inset-x-0 h-20 bg-linear-to-t from-[#0a0a0f] to-transparent"></div>
        </div>
    </div>

    <div class="relative z-20 mx-auto flex w-full max-w-[1700px] flex-1 flex-col justify-between px-6 md:px-10 pointer-events-none">
        
        <div class="flex flex-col pt-2 gap-1 animate-fade-in-down pointer-events-auto">
            <p class="text-[clamp(19.2px,5.52vw,28.8px)] uppercase tracking-[0.06em] text-primary font-bold">Backend Developer</p>
            <p class="text-sm font-mono uppercase tracking-[0.13em] text-gray-300">
                BUILDING SCALABLE & HIGH-PERFORMANCE BACKEND SYSTEMS
            </p>
        </div>

        <div class="flex flex-col mb-4 pointer-events-auto">
            <div class="flex flex-col animate-fade-in-up">
                <h1 class="magnetic-text text-[clamp(80px,11vw,170px)] uppercase tracking-[-2px] text-white leading-[0.86]" 
                    data-mode="expand" 
                    data-min="200" 
                    data-max="900">
                    Yaroslav
                </h1>

                <h1 class="magnetic-text text-[clamp(90px,12vw,190px)] uppercase tracking-[-2px] text-primary leading-[0.84]" 
                    data-mode="collapse" 
                    data-min="100" 
                    data-max="900">
                    Zaitsev.
                </h1>
            </div>

            <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-2 animate-fade-in opacity-0" style="animation-delay: 400ms; animation-fill-mode: forwards;">
                <span class="hud-label flex items-center gap-2 text-gray-200 uppercase">
                    <i class="text-primary fa-solid fa-briefcase"></i>
                    4+ years of programming experience
                </span>
                <span data-hero-tag="true" class="hud-label flex items-center gap-2 text-gray-200 uppercase">
                    <i class="text-primary fa-solid fa-location-dot"></i>
                    Based in Tallinn, Estonia
                </span>
            </div>
        </div>

    </div>
</section>
